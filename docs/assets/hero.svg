<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">claude-pilot</title>
  <desc id="desc">Give it a goal. Let it keep going. A bounded autonomy loop for Claude Code, on your computer, VPS, or across your servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e22"/><stop offset="1" stop-color="#273733"/></linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5c4"/><stop offset="1" stop-color="#d88a65"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#b2c5b8" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
  <g fill="none" stroke="#9bb6a8">
    <circle cx="954" cy="219" r="189" opacity=".12"/>
    <circle cx="954" cy="219" r="143" opacity=".16"/>
    <circle cx="954" cy="219" r="96" opacity=".20"/>
    <path d="M776 282 C715 187 798 63 920 65 C1020 65 1105 153 1092 252 C1080 342 996 389 909 355" stroke="#dca582" stroke-width="2" stroke-dasharray="5 9" opacity=".75"/>
