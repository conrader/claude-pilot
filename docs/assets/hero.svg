  <g font-family="DejaVu Sans, Arial, sans-serif">
    <path d="M58 50 L87 41 L77 70 L71 58 Z" fill="#e7b18e"/>
    <text x="105" y="63" fill="#f3eee4" font-size="24" font-weight="700" letter-spacing="-.7">claude-pilot</text>
    <text x="58" y="134" fill="#9fbdaf" font-size="12" font-weight="700" letter-spacing="3">THE AUTONOMY LOOP FOR CLAUDE CODE</text>
    <text x="54" y="210" fill="#f4f0e7" font-size="64" font-weight="700" letter-spacing="-3">Give it a goal.</text>
    <text x="54" y="283" fill="#eab18b" font-size="64" font-weight="700" letter-spacing="-3">Let it keep going.</text>
    <text x="58" y="332" fill="#b4c0b7" font-size="19">Resume quiet sessions. Carry the work forward.</text>
    <path d="M58 374 H639" stroke="#52625c" stroke-opacity=".6"/>
    <text x="58" y="415" fill="#d7ded5" font-size="14" letter-spacing=".6">YOUR COMPUTER</text>
    <circle cx="224" cy="410" r="2.5" fill="#dca582"/>
    <text x="244" y="415" fill="#d7ded5" font-size="14" letter-spacing=".6">YOUR VPS</text>
    <circle cx="346" cy="410" r="2.5" fill="#dca582"/>
    <text x="366" y="415" fill="#d7ded5" font-size="14" letter-spacing=".6">YOUR SERVERS</text>
  </g>
  <path d="M846 212 L1039 126 L976 318 L927 244 Z" fill="url(#plane)"/>
